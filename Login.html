<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN - FITCORE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="dark-card auth-card text-center p-4">
    <!-- Brand Logo -->
    <a href="Home.html" class="brand-logo text-decoration-none d-block mb-3">
      <img src="images/logo1.png" alt="FitCore Logo" class="brand-logo-img">
    </a>

    <!-- Navigation Toggling -->
    <ul class="nav nav-pills nav-justified mb-4" id="authTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="signin-tab" data-bs-toggle="pill" data-bs-target="#signin" type="button" role="tab">Sign In</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup" type="button" role="tab">Create Account</button>
      </li>
    </ul>

<!-- Tab of Content -->
  <div class="tab-content" id="authTabContent">
    <!-- Sign In -->
    <div class="tab-pane fade show active" id="signin" role="tabpanel">
      <form id="signinForm">
        <div class="text-start mb-3">
          <label class="form-label small text-secondary">USERNAME</label>
          <input type="text" name="username" class="form-control form-control-dark" placeholder="Enter your username" required>
        </div>
        <div class="text-start mb-3">
          <label class="form-label small text-secondary">PASSWORD</label>
          <input type="password" name="password" class="form-control form-control-dark" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-neon w-100 py-2 mt-2">SIGN IN</button>
      </form>
    </div>

    <!-- Create an Account -->
    <div class="tab-pane fade" id="signup" role="tabpanel">
      <form id="signupForm">
        <div class="text-start mb-2">
          <label class="form-label small text-secondary">FULL NAME</label>
          <input type="text" name="full_name" class="form-control form-control-dark" placeholder="Your full name" required>
        </div>
        <div class="text-start mb-2">
          <label class="form-label small text-secondary">EMAIL</label>
          <input type="email" name="email" class="form-control form-control-dark" placeholder="your@email.com" required>
        </div>
        <div class="text-start mb-2">
          <label class="form-label small text-secondary">USERNAME</label>
          <input type="text" name="username" class="form-control form-control-dark" placeholder="Choose a username" required>
        </div>
        <div class="text-start mb-2">
          <label class="form-label small text-secondary">PASSWORD</label>
          <input type="password" name="password" class="form-control form-control-dark" placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn btn-neon w-100 py-2 mt-3">CREATE ACCOUNT</button>
      </form>
    </div>
  </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    //Request to sign in
    document.getElementById('signinForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch('auth/login.php', { method: 'POST', body: new FormData(e.target) });
        const data = await res.json();
        if (data.status === 'success') {
          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('userName', data.userName);
          window.location.href = 'Dashboard.html';
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Connection error!');
      }
    });

    //Request to sign up
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch('auth/register.php', { method: 'POST', body: new FormData(e.target) });
        const data = await res.json();
        if (data.status === 'success') {
          localStorage.setItem('isLoggedIn', 'true');
          alert('Registration successful!');
          window.location.href = 'Dashboard.html';
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Connection error!');
      }
    });
  </script>
</body>
</html>
